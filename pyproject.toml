[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-adaptive-research-framework"
version = "0.1.0"
description = "Quantitative research and validation framework for testing fixed and adaptive grid trading strategies, risk controls, and economic edge."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/wirojwm/grid-adaptive-research-framework"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
